# ---------------------------------------------------------------------------
# nginx — frontend 18check.online  (REFERÊNCIA)
#
# ATENÇÃO: o servidor JÁ TEM uma configuração funcionando e o site está no ar.
# NÃO sobrescreva o arquivo do servidor por este sem antes comparar:
#
#   diff /etc/nginx/sites-available/18check.online \
#        /var/www/18check-frontend/deploy/nginx/18check.online.conf
#
# Este arquivo serve para: (1) entender o que está configurado,
# (2) reconstruir do zero se o servidor for perdido.
#
# Depois de qualquer alteração:  nginx -t && systemctl reload nginx
# ---------------------------------------------------------------------------

# HTTP -> HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name 18check.online www.18check.online;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name 18check.online www.18check.online;

    # Certificados emitidos pelo certbot (Let's Encrypt)
    ssl_certificate     /etc/letsencrypt/live/18check.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/18check.online/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Pasta onde o build (dist/) é publicado
    root /var/www/18check.online;
    index index.html;

    # Compressão
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/manifest+json;

    # Cabeçalhos de segurança
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Assets com hash no nome (index-AbC123.js) — cache longo e imutável
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # Service worker NUNCA pode ficar em cache, senão o usuário trava
    # numa versão antiga do site depois do deploy.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires off;
    }

    # index.html também não pode ficar em cache — é ele que aponta
    # para os assets novos a cada deploy.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires off;
    }

    # SPA: qualquer rota (/login, /app/search...) devolve o index.html,
    # senão o React Router quebra ao recarregar a página.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
