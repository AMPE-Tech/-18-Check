# ---------------------------------------------------------------------------
# nginx — API api.18check.online  (REFERÊNCIA)
#
# A API já está no ar e funcionando (testado: POST /api/auth/login responde
# 401 com JSON correto, GET /api/user/me responde 401, GET /health responde 200).
# Este arquivo documenta o padrão. NÃO sobrescreva o do servidor sem comparar.
#
# O nginx aqui é só um "porteiro": recebe o HTTPS na porta 443 e repassa
# para o Node/Express que roda localmente (porta 3000 por padrão).
# ---------------------------------------------------------------------------

server {
    listen 80;
    listen [::]:80;
    server_name api.18check.online;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.18check.online;

    ssl_certificate     /etc/letsencrypt/live/api.18check.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.18check.online/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Upload de foto na verificação de liveness pode passar do padrão (1 MB)
    client_max_body_size 12M;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        # A verificação de liveness / busca pode demorar mais que o padrão (60s)
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
